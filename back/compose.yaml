name: nasa

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment: &salus_environment
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${NASA_DATABASE:-${POSTGRES_DB}}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      AI_BASE_URL: ${AI_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_API_KEY: ${AI_API_KEY:-}
      FOOD_EXPIRATION_WARNING_DAYS: ${FOOD_EXPIRATION_WARNING_DAYS:-7}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
      RAG_MINIMUM_SIMILARITY: ${RAG_MINIMUM_SIMILARITY:-0.3}
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      PREDICTION_MANUAL_COOLDOWN_SECONDS: ${PREDICTION_MANUAL_COOLDOWN_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m scripts.startup uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  risk-worker:
    build: .
    volumes:
      - .:/app
    environment: *salus_environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m scripts.risk_worker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  predictive-worker:
    build: .
    volumes:
      - .:/app
    environment:
      <<: *salus_environment
      PREDICTION_SCHEDULE_HOURS: ${PREDICTION_SCHEDULE_HOURS:-6}
      PREDICTION_WORKER_INTERVAL_SECONDS: ${PREDICTION_WORKER_INTERVAL_SECONDS:-300}
      PREDICTION_MAX_ATTEMPTS: ${PREDICTION_MAX_ATTEMPTS:-3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m scripts.predictive_worker_service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
